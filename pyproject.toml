[project]
name = "capnp-stub-generator"
version = "0.0.11"
description = "Cap'n Proto stub generator"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Adrian Figueroa", email = "adrian.figueroa@metirionic.com" },
  { name = "Vincent Dlugosch", email = "vincent.dlugosch@zalf.de" },
]
maintainers = [
  { name = "Vincent Dlugosch", email = "vincent.dlugosch@zalf.de" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "pycapnp>=2.0.0,<3.0.0",
  "pyright>=1.1.407,<2.0.0",
  "ruff>=0.14.3",
]

[project.urls]
Homepage = "https://github.com/zalf-rpm/capnp-stub-generator"
Repository = "https://github.com/zalf-rpm/capnp-stub-generator"
Issues = "https://github.com/zalf-rpm/capnp-stub-generator/issues"

[project.scripts]
capnp-stub-generator = "capnp_stub_generator.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.0,<10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/capnp_stub_generator",
  "src/pycapnp-base-stubs",
  "src/capnp-stubs",
]

[tool.pyright]
reportExplicitAny = "none"
reportPropertyTypeMismatch = "none"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude generated directories from test collection
norecursedirs = [".*", "_generated*", "*.egg", "dist", "build"]
